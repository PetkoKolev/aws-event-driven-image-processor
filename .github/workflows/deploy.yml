name: Deploy AWS Image Processor

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Build image processor Lambda using Docker (FIXES PIL ISSUE)
      - name: Build image processor package (Lambda compatible)
        working-directory: image-processing-pipeline/lambda/image_processor
        run: |
          docker run --rm \
            -v "$PWD":/var/task \
            --entrypoint /bin/sh \
            public.ecr.aws/lambda/python:3.11 \
            -c "pip install -r requirements.txt -t ."
          zip -r ../../image_processor.zip .

      # DLQ reprocessor (no dependencies)
      - name: Build DLQ reprocessor package
        working-directory: image-processing-pipeline/lambda/dlq_reprocessor
        run: |
          zip -r ../../dlq_reprocessor.zip .

      # API Lambda (no dependencies)
      - name: Build API Lambda package
        working-directory: backend/api
        run: |
          zip function.zip handler.py    

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::525238913839:role/github-actions-terraform-deploy
          aws-region: eu-west-2

      - name: Terraform Format Check
        working-directory: image-processing-pipeline
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: image-processing-pipeline
        run: terraform init

      - name: Terraform Validate
        working-directory: image-processing-pipeline
        run: terraform validate

      - name: Terraform Plan
        working-directory: image-processing-pipeline
        run: terraform plan
      
      - name: Terraform Apply
        working-directory: image-processing-pipeline
        run: terraform apply -auto-approve

      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/ s3://ipp-frontend-petkokolev-cloud-com --delete
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Upload</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <h1>Image Upload</h1>

    <div class="upload-section">
      <input type="file" id="fileInput" />

      <select id="modeSelect">
        <option value="web">Web Optimized</option>
        <option value="thumbnail">Thumbnail</option>
        <option value="hq">High Quality</option>
      </select>

      <button id="uploadBtn">Upload</button>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <p id="status" class="status-text"></p>

    <div class="images">
      <div class="image-block">
        <h2>Original</h2>
        <img id="original" />
      </div>

      <div class="image-block">
        <h2>Processed</h2>
        <img id="processed" />
        <button id="downloadBtn" style="display:none; margin-top:10px;">
          Download Processed Image
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://3heztdwn22.execute-api.eu-west-2.amazonaws.com";

    document.getElementById("uploadBtn").addEventListener("click", upload);

    async function upload() {
      const file = document.getElementById("fileInput").files[0];
      const mode = document.getElementById("modeSelect").value;
      if (!file) return alert("Pick a file");

      const status = document.getElementById("status");
      const progressBar = document.getElementById("progressBar");
      const processedImg = document.getElementById("processed");
      const downloadBtn = document.getElementById("downloadBtn");

      progressBar.style.width = "0%";
      status.innerText = "Starting upload...";
      processedImg.src = "";
      downloadBtn.style.display = "none";

      document.getElementById("original").src = URL.createObjectURL(file);

      progressBar.style.width = "10%";

      // STEP 1: Get upload URL
      const res = await fetch(`${API_BASE}/upload?mode=${mode}`, {
        method: "POST",
        headers: {
          "Content-Type": file.type
        }
      });

      const data = await res.json();

      if (!data.upload_url || !data.file_key) {
        console.error("Upload API broken:", data);
        return alert("Upload API failed");
      }

      progressBar.style.width = "30%";

      // STEP 2: Upload to S3
      await fetch(data.upload_url, {
        method: "PUT",
        headers: {
          "Content-Type": file.type,
          "x-amz-meta-mode": mode
        },
        body: file
      });

      progressBar.style.width = "60%";
      status.innerText = "Processing image...";

      const fileKey = data.file_key;

      let attempts = 0;
      const maxAttempts = 30;
      let finished = false; // NEW

      async function checkImage() {
        if (finished) return; // STOP LOOP

        try {
          const res = await fetch(`${API_BASE}/image?key=${fileKey}`);

          // handle API not ready (404/500)
          if (res.status === 404) {
            attempts++;
            progressBar.style.width = `${60 + attempts * 2}%`;

            if (attempts < maxAttempts && !finished) {
              setTimeout(checkImage, 1500);
            } else {
              status.innerText = "Processing took too long";
            }
            return;
          }

          if (!res.ok) {
            throw new Error(`Unexpected API error (${res.status})`);
          }

          const imgData = await res.json();

          if (!imgData.image_url) {
            throw new Error("No image_url returned");
          }

          const signedUrl = imgData.image_url;

          // wait for ACTUAL image load
          processedImg.onload = () => {
            finished = true;
            progressBar.style.width = "100%";
            status.innerText = "Completed";

            downloadBtn.style.display = "inline-block";

            downloadBtn.onclick = () => {
              const a = document.createElement("a");
              a.href = signedUrl;
              a.download = "processed-image.jpg";
              document.body.appendChild(a);
              a.click();
              a.remove();
            }
          };

          processedImg.onerror = () => {
            throw new Error("Image not accessible yet");
          };

          processedImg.src = signedUrl;

        } catch (err) {
          attempts++;
          progressBar.style.width = `${60 + attempts * 2}%`;

          if (attempts < maxAttempts && !finished) {
            setTimeout(checkImage, 1500);
          } else if (!finished) {
            status.innerText = "Processing took too long";
            console.error("Final failure:", err);
          }
        }
      }

      checkImage();
    }
  </script>
</body>

</html>

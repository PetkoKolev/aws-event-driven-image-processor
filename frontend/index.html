<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Upload</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <h1>Image Upload</h1>
    <p class="subtitle">
      Upload an image, optimize it with AWS Lambda, and download the result.
    </p>

    <div class="upload-card">

      <div id="dropZone" class="drop-zone">
        <input type="file" id="fileInput" accept="image/jpeg,image/png" hidden />
        <div class="drop-content">
          <div class="upload-icon">☁️</div>
          <h3>Drop Your Image Here</h3>
          <p>or click to browse</p>
        </div>
      </div>

      <div class="controls">
        <select id="modeSelect">
          <option value="web">Web Optimized</option>
          <option value="thumbnail">Thumbnail</option>
          <option value="hq">High Quality</option>
        </select>

        <button id="uploadBtn">Upload</button>
      </div>

      <div class="images">
        <div class="image-block">
          <h2>Original</h2>
          <div class="image-card">
            <img id="original" />
            <div id="originalPlaceholder" class="placeholder">
              No image selected
            </div>
          </div>
        </div>

        <div class="image-block">
          <h2>Processed</h2>
          <div class="image-card">
            <img id="processed" />
            <div id="processedPlaceholder" class="placeholder">
              Waiting for upload
            </div>
          </div>
        </div>
      </div>

      <div class="bottom-actions">
        <div class="progress-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <p id="status" class="status-text"></p>

        <button id="downloadBtn" style="display:none;">
          Download Processed Image
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://3heztdwn22.execute-api.eu-west-2.amazonaws.com";

    const uploadBtn = document.getElementById("uploadBtn");
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const originalImg = document.getElementById("original");
    const processedImg = document.getElementById("processed");
    const originalPlaceholder = document.getElementById("originalPlaceholder");
    const processedPlaceholder = document.getElementById("processedPlaceholder");

    uploadBtn.addEventListener("click", upload);

    function showPreview(file) {
      if (!file) return;

      const previewUrl = URL.createObjectURL(file);

      originalImg.src = previewUrl;
      originalImg.style.display = "block";
      originalPlaceholder.style.display = "none";

      processedImg.src = "";
      processedImg.style.display = "none";
      processedPlaceholder.style.display = "flex";
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      showPreview(file);
    });

    dropZone.addEventListener("click", () => {
      fileInput.click();
    });

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");

      const files = e.dataTransfer.files;

      if (files.length > 0) {
        fileInput.files = files;
        showPreview(files[0]);
      }
    });

    async function upload() {
      const file = fileInput.files[0];
      const mode = document.getElementById("modeSelect").value;

      if (!file) {
        alert("Pick a file");
        return;
      }

      const status = document.getElementById("status");
      const progressBar = document.getElementById("progressBar");
      const downloadBtn = document.getElementById("downloadBtn");

      progressBar.style.width = "0%";
      status.innerText = "Starting upload...";
      processedImg.src = "";
      processedImg.style.display = "none";
      processedPlaceholder.style.display = "flex";
      downloadBtn.style.display = "none";

      progressBar.style.width = "10%";

      const res = await fetch(`${API_BASE}/upload?mode=${mode}`, {
        method: "POST",
        headers: {
          "Content-Type": file.type
        }
      });

      const data = await res.json();

      if (!data.upload_url || !data.file_key) {
        alert("Upload API failed");
        return;
      }

      progressBar.style.width = "30%";

      await fetch(data.upload_url, {
        method: "PUT",
        headers: {
          "Content-Type": file.type,
          "x-amz-meta-mode": mode
        },
        body: file
      });

      progressBar.style.width = "60%";
      status.innerText = "Processing image...";

      const fileKey = data.file_key;
      let attempts = 0;
      const maxAttempts = 30;
      let finished = false;

      async function checkImage() {
        if (finished) return;

        try {
          const res = await fetch(`${API_BASE}/image?key=${fileKey}`);

          if (res.status === 404) {
            attempts++;

            if (attempts < maxAttempts) {
              setTimeout(checkImage, 1500);
            } else {
              status.innerText = "Processing took too long";
            }

            return;
          }

          const imgData = await res.json();
          const signedUrl = imgData.image_url;

          processedImg.onload = () => {
            finished = true;
            progressBar.style.width = "100%";
            status.innerText = "Completed";

            processedImg.style.display = "block";
            processedPlaceholder.style.display = "none";
            downloadBtn.style.display = "inline-block";

            downloadBtn.onclick = () => {
              const a = document.createElement("a");
              a.href = signedUrl;
              a.download = "processed-image.jpg";
              document.body.appendChild(a);
              a.click();
              a.remove();
            };
          };

          processedImg.src = signedUrl;

        } catch {
          attempts++;

          if (attempts < maxAttempts) {
            setTimeout(checkImage, 1500);
          } else {
            status.innerText = "Processing took too long";
          }
        }
      }

      checkImage();
    }
  </script>
</body>

</html>

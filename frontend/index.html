<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Upload</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <h1>Image Upload</h1>

    <div class="upload-section">
      <input type="file" id="fileInput" />
      <button id="uploadBtn">Upload</button>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <p id="status" class="status-text"></p>

    <div class="images">
      <div class="image-block">
        <h2>Original</h2>
        <img id="original" />
      </div>

      <div class="image-block">
        <h2>Processed</h2>
        <img id="processed" />
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://3heztdwn22.execute-api.eu-west-2.amazonaws.com";

    document.getElementById("uploadBtn").addEventListener("click", upload);

    async function upload() {
      const file = document.getElementById("fileInput").files[0];
      if (!file) return alert("Pick a file");

      const status = document.getElementById("status");
      const progressBar = document.getElementById("progressBar");
      const processedImg = document.getElementById("processed");

      progressBar.style.width = "0%";
      status.innerText = "Starting upload...";
      processedImg.src = "";

      document.getElementById("original").src = URL.createObjectURL(file);

      progressBar.style.width = "10%";

      // Step 1: Get presigned upload URL
      const res = await fetch(`${API_BASE}/upload`, {
        method: "POST",
        headers: {
          "Content-Type": file.type
        }
      });

      const data = await res.json();
      progressBar.style.width = "30%";

      // Step 2: Upload to S3
      await fetch(data.upload_url, {
        method: "PUT",
        headers: {
          "Content-Type": file.type
        },
        body: file
      });

      progressBar.style.width = "60%";
      status.innerText = "Processing image...";

      const fileKey = data.file_key;

      let attempts = 0;
      const maxAttempts = 15;

      async function checkImage() {
        try {
          const fileName = fileKey.split("/")[1];
          const fileId = fileName.split(".")[0];
          const extension = fileName.split(".")[1];

          const processedKey = `processed/resized-${fileId}.${extension}`;

          const res = await fetch(`${API_BASE}/image?key=${processedKey}`);
          const imgData = await res.json();

          const signedUrl = imgData.image_url;

          const testImg = new Image();

          testImg.onload = () => {
            processedImg.src = signedUrl;
            progressBar.style.width = "100%";
            status.innerText = "Completed";
          };

          testImg.onerror = () => {
            throw new Error("Not ready yet");
          };

          testImg.src = signedUrl + "&t=" + new Date().getTime();

        } catch (err) {
          attempts++;
          progressBar.style.width = `${60 + attempts * 2}%`;

          if (attempts < maxAttempts) {
            setTimeout(checkImage, 1500);
          } else {
            status.innerText = "Processing took too long";
          }
        }
      }

      checkImage();
    }
  </script>
</body>

</html>
